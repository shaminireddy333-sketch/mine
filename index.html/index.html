<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Will You Marry Me?</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#ff758c,#ff7eb3);display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
.card{background:#fff;padding:40px;border-radius:20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
button{padding:12px 28px;font-size:18px;border:none;border-radius:10px;margin:15px;cursor:pointer}
#yes{background:#4CAF50;color:#fff}#no{background:#f44336;color:#fff;position:absolute}
#result{display:none;color:#e91e63;font-size:26px;font-weight:bold;margin-top:20px}
</style></head>
<body><div class="card">
<h1>💍 Will You Marry Me? ❤️</h1>
<p>Dear <b>[Her Name]</b>,<br>I want to spend my life with you.<br>Will you marry me?</p>
<button id="yes">Yes ❤️</button><button id="no">No 💔</button>
<div id="result">🎉 Thank you! You made me the happiest person! ❤️</div>
</div>
<script>
const no=document.getElementById('no');
function mv(){no.style.left=Math.random()*(innerWidth-120)+'px';no.style.top=Math.random()*(innerHeight-60)+'px';}
mv();no.onmouseover=mv;no.onclick=mv;
document.getElementById('yes').onclick=()=>document.getElementById('result').style.display='block';
</script></body></html>
