<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💍 Will You Marry Me?</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:url("./background.jpg")
    center center / cover no-repeat;
    position:relative;
}

/* Dark Overlay */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.35);
    backdrop-filter:blur(2px);
}

/* Floating Hearts */
.hearts{
    position:absolute;
    inset:0;
    overflow:hidden;
    z-index:0;
}

.heart{
    position:absolute;
    color:white;
    opacity:.8;
    animation:float linear infinite;
    user-select:none;
}

@keyframes float{
    0%{
        transform:translateY(100vh) scale(.5);
        opacity:0;
    }
    20%{
        opacity:.9;
    }
    100%{
        transform:translateY(-120px) scale(1.4);
        opacity:0;
    }
}

/* Glass Card */
.card{
    position:relative;
    z-index:2;
    width:92%;
    max-width:430px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.25);
    backdrop-filter:blur(14px);
    border-radius:28px;
    padding:35px 25px;
    text-align:center;
    color:white;
    box-shadow:0 8px 40px rgba(0,0,0,.35);
    animation:fadeUp 1.2s;
}

@keyframes fadeUp{
    from{
        transform:translateY(30px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

h1{
    font-size:2rem;
    line-height:1.4;
    margin-bottom:15px;
}

p{
    margin-bottom:30px;
    font-size:1rem;
}

.buttons{
    position:relative;
    height:80px;
}

button{
    border:none;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
    padding:14px 28px;
    border-radius:40px;
    transition:.3s;
}

#yes{
    background:white;
    color:#d63384;
    margin-right:15px;
}

#yes:hover{
    transform:scale(1.08);
}

#no{
    position:absolute;
    background:rgba(255,255,255,.18);
    color:white;
    border:1px solid rgba(255,255,255,.4);
}

#message{
    display:none;
    margin-top:25px;
    animation:fadeIn 1s;
}

#message h2{
    margin-bottom:15px;
}

#message p{
    line-height:1.8;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Confetti */
.confetti{
    position:fixed;
    width:10px;
    height:16px;
    top:-20px;
    z-index:9999;
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate
