<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>💍 Bavaa🤍, Will You Marry Me? 🤍</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;background:url("./background.jpg
") center/cover no-repeat;position:relative}
body:before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.35)}
.hearts{position:absolute;inset:0}.heart{position:absolute;color:#fff;animation:f linear infinite}
@keyframes f{0%{transform:translateY(100vh);opacity:0}20%{opacity:1}100%{transform:translateY(-120px);opacity:0}}
.card{position:relative;z-index:2;max-width:430px;width:92%;padding:30px;border-radius:24px;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);color:#fff;text-align:center}
.buttons{position:relative;height:70px}button{padding:12px 22px;border:none;border-radius:30px;font-size:18px;cursor:pointer}#yes{background:#fff;color:#d63384}#no{position:absolute;left:180px;background:rgba(255,255,255,.2);color:#fff}#msg{display:none;margin-top:20px}
.confetti{position:fixed;width:8px;height:12px;top:-20px;animation:fall 4s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style></head><body><div class="hearts" id=h></div><div class="card"><h1>💍 Bavaa🤍,<br>Will You Marry Me? 🤍</h1><p>Every moment with you feels magical. 🤍</p><div class="buttons"><button id=yes>Yes 🤍</button><button id=no>No 🤍</button></div><div id=msg><h2>🤍 You Said YES! 🤍</h2><p>My Dearest Bavaa🤍,<br><br>I promise to stand beside you, love you forever, and choose you every single day.<br><br>🤍 I Love You Forever & Always. 🤍</p></div></div><script>
const h=document.getElementById('h');for(let i=0;i<40;i++){let e=document.createElement('div');e.className='heart';e.innerHTML='🤍';e.style.left=Math.random()*100+'vw';e.style.fontSize=(18+Math.random()*20)+'px';e.style.animationDuration=(5+Math.random()*5)+'s';h.appendChild(e);}
no.onmouseover=()=>{no.style.left=Math.random()*(innerWidth-120)+'px';no.style.top=Math.random()*(innerHeight-80)+'px';};
yes.onclick=()=>{document.querySelector('.buttons').style.display='none';msg.style.display='block';for(let i=0;i<150;i++){let c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=['#fff','#eee','#ddd'][Math.floor(Math.random()*3)];document.body.appendChild(c);setTimeout(()=>c.remove(),4000);}};
</script></body></html>
